name: Build and Deploy Astro

on:
  push:
    branches: [main, master, preview, develop]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'H6: test deploy; production request is check-only'
        required: true
        default: test
        type: choice
        options:
          - test
          - production

permissions: {}

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
    outputs:
      deploy_target: ${{ steps.deploy-meta.outputs.deploy_target }}
      deploy_kind: ${{ steps.deploy-meta.outputs.deploy_kind }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: deploy-meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TARGET: ${{ github.event.inputs.deploy_target }}
          TEST_SITE_URL_VAR: ${{ vars.TEST_SITE_URL }}
          TEST_BASE_PATH_VAR: ${{ vars.TEST_BASE_PATH }}
        run: |
          production_enabled="false"
          site_url_configured="false"

          target="test"
          deploy_kind="check-only"
          deploy_reason="H6 defaults to a test build without deployment."

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            requested_target="${DISPATCH_TARGET:-test}"
            if [ "$requested_target" = "production" ]; then
              target="test"
              deploy_kind="check-only"
              deploy_reason="H6 production deploy is hard-disabled; the production request is check-only."
            elif [ "${GITHUB_REF_NAME}" = "preview" ]; then
              target="test"
              deploy_kind="test"
              deploy_reason="workflow_dispatch requested test for the protected preview ref."
            else
              target="test"
              deploy_kind="check-only"
              deploy_reason="workflow_dispatch test may deploy only the preview ref; this ref is check-only."
            fi
          elif [ "${GITHUB_REF_NAME}" = "preview" ]; then
            target="test"
            deploy_kind="test"
            deploy_reason="preview branch uses the test deployment."
          elif [ "${GITHUB_REF_NAME}" = "develop" ]; then
            target="test"
            deploy_kind="check-only"
            deploy_reason="develop is check-only; only preview may update GitHub Pages."
          elif [ "${GITHUB_REF_NAME}" = "main" ] || [ "${GITHUB_REF_NAME}" = "master" ]; then
            target="test"
            deploy_kind="check-only"
            deploy_reason="H6 main/master is check-only; production release is not implemented."
          else
            target="test"
            deploy_kind="check-only"
            deploy_reason="Non-deploy branch; running test build only."
          fi

          repo_name="${GITHUB_REPOSITORY#*/}"
          if [ "$repo_name" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            fallback_base_path="/"
          else
            fallback_base_path="/${repo_name}"
          fi
          base_path="${TEST_BASE_PATH_VAR:-$fallback_base_path}"
          if [ -n "$TEST_SITE_URL_VAR" ]; then
            test_site_url="$TEST_SITE_URL_VAR"
            effective_site_url_source="TEST_SITE_URL"
          else
            test_site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io"
            effective_site_url_source="GitHub Pages fallback"
          fi
          effective_site_url="${test_site_url}"
          production_check_ran="false"

          echo "deploy_target=${target}" >> "$GITHUB_OUTPUT"
          echo "deploy_kind=${deploy_kind}" >> "$GITHUB_OUTPUT"
          echo "base_path=${base_path}" >> "$GITHUB_OUTPUT"
          echo "test_site_url=${test_site_url}" >> "$GITHUB_OUTPUT"
          echo "effective_site_url=${effective_site_url}" >> "$GITHUB_OUTPUT"
          echo "effective_site_url_source=${effective_site_url_source}" >> "$GITHUB_OUTPUT"
          echo "production_check_ran=${production_check_ran}" >> "$GITHUB_OUTPUT"
          echo "production_enabled=${production_enabled}" >> "$GITHUB_OUTPUT"
          echo "site_url_configured=${site_url_configured}" >> "$GITHUB_OUTPUT"
          echo "deploy_reason=${deploy_reason}" >> "$GITHUB_OUTPUT"
          echo "EVENT_NAME=${EVENT_NAME}"
          echo "github.ref_name=${GITHUB_REF_NAME}"
          echo "PRODUCTION_DEPLOY_ENABLED=${production_enabled}"
          echo "detected DEPLOY_TARGET=${target}"
          echo "Deploy kind: ${deploy_kind}"
          echo "Base path: ${base_path}"
          echo "productionCheckRan=${production_check_ran}"
          echo "SITE_URL configured: ${site_url_configured}"
          echo "effective SITE_URL source: ${effective_site_url_source}"
          echo "Deploy decision: ${deploy_reason}"
          echo "H6 production deploy is hard-disabled. Production requests run checks only."
          {
            echo "### Deploy metadata"
            echo "- Event: ${EVENT_NAME}"
            echo "- Ref: ${GITHUB_REF_NAME}"
            echo "- PRODUCTION_DEPLOY_ENABLED: ${production_enabled}"
            echo "- Detected DEPLOY_TARGET: ${target}"
            echo "- Deploy kind: ${deploy_kind}"
            echo "- SITE_URL configured: ${site_url_configured}"
            echo "- productionCheckRan: ${production_check_ran}"
            echo "- Effective SITE_URL source: ${effective_site_url_source}"
            echo "- Base path: ${base_path}"
            echo "- Decision: ${deploy_reason}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0

      - run: npm ci

      - name: Run H6 admin tests and secondary editor browser round-trip
        run: npm run qa:h6:admin

      - name: Validate H6 browser evidence contracts
        run: npm run test:h6-evidence-contracts

      - name: Restore responsive media build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: public/_media/h5
          key: ${{ runner.os }}-node22-h5-media-v2-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node22-h5-media-v2-

      - run: npm run check
        env:
          DEPLOY_TARGET: ${{ steps.deploy-meta.outputs.deploy_target }}
          PRODUCTION_DEPLOY_ENABLED: ${{ steps.deploy-meta.outputs.production_enabled }}
          SITE_URL: ${{ steps.deploy-meta.outputs.effective_site_url }}
          TEST_SITE_URL: ${{ steps.deploy-meta.outputs.test_site_url }}
          BASE_PATH: ${{ steps.deploy-meta.outputs.base_path }}

      - run: npm run build
        env:
          DEPLOY_TARGET: ${{ steps.deploy-meta.outputs.deploy_target }}
          PRODUCTION_DEPLOY_ENABLED: ${{ steps.deploy-meta.outputs.production_enabled }}
          SITE_URL: ${{ steps.deploy-meta.outputs.effective_site_url }}
          TEST_SITE_URL: ${{ steps.deploy-meta.outputs.test_site_url }}
          BASE_PATH: ${{ steps.deploy-meta.outputs.base_path }}

      - name: Prove targeted exact SSG against the full production build
        run: npm run qa:h6:exact-targeted
        env:
          TEST_SITE_URL: ${{ steps.deploy-meta.outputs.test_site_url }}
          BASE_PATH: ${{ steps.deploy-meta.outputs.base_path }}

      - name: Validate deterministic performance budgets
        run: npm run qa:performance
        env:
          BASE_PATH: ${{ steps.deploy-meta.outputs.base_path }}

      - name: Validate final source and rendered contracts
        run: npm run qa:final:static
        env:
          DEPLOY_TARGET: ${{ steps.deploy-meta.outputs.deploy_target }}
          BASE_PATH: ${{ steps.deploy-meta.outputs.base_path }}

      - name: Validate public search matching and generated coverage
        run: npm run test:public-search && npm run qa:public-search

      - name: Prepare proven reachable Pages artifact
        run: npm run deploy:prepare
        env:
          BASE_PATH: ${{ steps.deploy-meta.outputs.base_path }}

      - name: Revalidate published Pages artifact
        run: npm run qa:performance
        env:
          BASE_PATH: ${{ steps.deploy-meta.outputs.base_path }}

      - name: Verify public search survives deploy pruning
        run: npm run qa:public-search

      - name: Run browser and motion gates
        run: npm run qa:final:browser
        env:
          BASE_PATH: ${{ steps.deploy-meta.outputs.base_path }}

      - name: Prove public artifact isolation
        run: npm run qa:deploy-isolation
        env:
          BASE_PATH: ${{ steps.deploy-meta.outputs.base_path }}

      - name: Open and reconcile every production route in public and editor modes
        run: npm run qa:h6:route-passport
        env:
          DEPLOY_TARGET: ${{ steps.deploy-meta.outputs.deploy_target }}
          BASE_PATH: ${{ steps.deploy-meta.outputs.base_path }}
          SITE_URL: ${{ steps.deploy-meta.outputs.effective_site_url }}
          TEST_SITE_URL: ${{ steps.deploy-meta.outputs.test_site_url }}

      - name: Crawl every public action in four deterministic shards
        run: npm run qa:h6:public-actions
        env:
          BASE_PATH: ${{ steps.deploy-meta.outputs.base_path }}

      - name: Run isolated visual-editor actions, media promotion and recovery acceptance
        run: npm run qa:h6:admin-actions

      - name: Prove GPS metadata removal through canonical, H5 and deploy artifact
        run: npm run qa:h6:media-privacy
        env:
          BASE_PATH: ${{ steps.deploy-meta.outputs.base_path }}

      - name: Prove checksummed backup and atomic restore in fresh exact-HEAD checkouts
        run: npm run qa:h6:backup-restore

      - name: Reconcile exact SHA, artifact and all browser evidence
        run: npm run qa:h6:verify-evidence

      - name: Write deterministic release artifact identity
        run: node tools/release/artifact-identity.mjs --dist dist --tested-sha "${GITHUB_SHA}"

      - name: Verify exact candidate and preview ref pair
        if: steps.deploy-meta.outputs.deploy_kind == 'test'
        shell: bash
        run: |
          candidate_sha="$(git ls-remote --refs origin refs/heads/v4-product-final-candidate | awk '{print $1}')"
          preview_sha="$(git ls-remote --refs origin refs/heads/preview | awk '{print $1}')"
          if [ -z "$candidate_sha" ] || [ -z "$preview_sha" ]; then
            echo "::error::Candidate or preview ref is missing; refusing Pages artifact upload."
            exit 1
          fi
          if [ "$candidate_sha" != "$preview_sha" ] || [ "$preview_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Pages deploy requires candidate == preview == tested GITHUB_SHA."
            echo "candidate=$candidate_sha preview=$preview_sha tested=$GITHUB_SHA"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.deploy-meta.outputs.deploy_kind == 'test'
        with:
          path: dist

  deploy-test:
    if: needs.build.outputs.deploy_kind == 'test'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Reconcile exact refs immediately before Pages deployment
        shell: bash
        run: |
          candidate_sha="$(git ls-remote --refs origin refs/heads/v4-product-final-candidate | awk '{print $1}')"
          preview_sha="$(git ls-remote --refs origin refs/heads/preview | awk '{print $1}')"
          if [ -z "$candidate_sha" ] || [ -z "$preview_sha" ]; then
            echo "::error::Candidate or preview ref is missing; refusing Pages deployment."
            exit 1
          fi
          if [ "$candidate_sha" != "$preview_sha" ] || [ "$preview_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Candidate/preview refs changed after validation; refusing Pages deployment."
            echo "candidate=$candidate_sha preview=$preview_sha tested=$GITHUB_SHA"
            exit 1
          fi

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
