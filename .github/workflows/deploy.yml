name: Build and Deploy Astro

on:
  push:
    branches: [main, master, preview, develop]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'H6: test deploy; production request is check-only'
        required: true
        default: test
        type: choice
        options:
          - test
          - production
      resume_evidence_run:
        description: 'Resume only reconciliation/deploy from a completed preview run with every browser job successful'
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    if: inputs.resume_evidence_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      deploy_target: ${{ steps.deploy-meta.outputs.deploy_target }}
      deploy_kind: ${{ steps.deploy-meta.outputs.deploy_kind }}
      base_path: ${{ steps.deploy-meta.outputs.base_path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: deploy-meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TARGET: ${{ github.event.inputs.deploy_target }}
          TEST_SITE_URL_VAR: ${{ vars.TEST_SITE_URL }}
          TEST_BASE_PATH_VAR: ${{ vars.TEST_BASE_PATH }}
        run: |
          production_enabled="false"
          site_url_configured="false"

          target="test"
          deploy_kind="check-only"
          deploy_reason="H6 defaults to a test build without deployment."

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            requested_target="${DISPATCH_TARGET:-test}"
            if [ "$requested_target" = "production" ]; then
              target="test"
              deploy_kind="check-only"
              deploy_reason="H6 production deploy is hard-disabled; the production request is check-only."
            elif [ "${GITHUB_REF_NAME}" = "preview" ]; then
              target="test"
              deploy_kind="test"
              deploy_reason="workflow_dispatch requested test for the protected preview ref."
            else
              target="test"
              deploy_kind="check-only"
              deploy_reason="workflow_dispatch test may deploy only the preview ref; this ref is check-only."
            fi
          elif [ "${GITHUB_REF_NAME}" = "preview" ]; then
            target="test"
            deploy_kind="test"
            deploy_reason="preview branch uses the test deployment."
          elif [ "${GITHUB_REF_NAME}" = "develop" ]; then
            target="test"
            deploy_kind="check-only"
            deploy_reason="develop is check-only; only preview may update GitHub Pages."
          elif [ "${GITHUB_REF_NAME}" = "main" ] || [ "${GITHUB_REF_NAME}" = "master" ]; then
            target="test"
            deploy_kind="check-only"
            deploy_reason="H6 main/master is check-only; production release is not implemented."
          else
            target="test"
            deploy_kind="check-only"
            deploy_reason="Non-deploy branch; running test build only."
          fi

          repo_name="${GITHUB_REPOSITORY#*/}"
          if [ "$repo_name" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            fallback_base_path="/"
          else
            fallback_base_path="/${repo_name}"
          fi
          base_path="${TEST_BASE_PATH_VAR:-$fallback_base_path}"
          if [ -n "$TEST_SITE_URL_VAR" ]; then
            test_site_url="$TEST_SITE_URL_VAR"
            effective_site_url_source="TEST_SITE_URL"
          else
            test_site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io"
            effective_site_url_source="GitHub Pages fallback"
          fi
          effective_site_url="${test_site_url}"
          production_check_ran="false"

          echo "deploy_target=${target}" >> "$GITHUB_OUTPUT"
          echo "deploy_kind=${deploy_kind}" >> "$GITHUB_OUTPUT"
          echo "base_path=${base_path}" >> "$GITHUB_OUTPUT"
          echo "test_site_url=${test_site_url}" >> "$GITHUB_OUTPUT"
          echo "effective_site_url=${effective_site_url}" >> "$GITHUB_OUTPUT"
          echo "effective_site_url_source=${effective_site_url_source}" >> "$GITHUB_OUTPUT"
          echo "production_check_ran=${production_check_ran}" >> "$GITHUB_OUTPUT"
          echo "production_enabled=${production_enabled}" >> "$GITHUB_OUTPUT"
          echo "site_url_configured=${site_url_configured}" >> "$GITHUB_OUTPUT"
          echo "deploy_reason=${deploy_reason}" >> "$GITHUB_OUTPUT"
          echo "EVENT_NAME=${EVENT_NAME}"
          echo "github.ref_name=${GITHUB_REF_NAME}"
          echo "PRODUCTION_DEPLOY_ENABLED=${production_enabled}"
          echo "detected DEPLOY_TARGET=${target}"
          echo "Deploy kind: ${deploy_kind}"
          echo "Base path: ${base_path}"
          echo "productionCheckRan=${production_check_ran}"
          echo "SITE_URL configured: ${site_url_configured}"
          echo "effective SITE_URL source: ${effective_site_url_source}"
          echo "Deploy decision: ${deploy_reason}"
          echo "H6 production deploy is hard-disabled. Production requests run checks only."
          {
            echo "### Deploy metadata"
            echo "- Event: ${EVENT_NAME}"
            echo "- Ref: ${GITHUB_REF_NAME}"
            echo "- PRODUCTION_DEPLOY_ENABLED: ${production_enabled}"
            echo "- Detected DEPLOY_TARGET: ${target}"
            echo "- Deploy kind: ${deploy_kind}"
            echo "- SITE_URL configured: ${site_url_configured}"
            echo "- productionCheckRan: ${production_check_ran}"
            echo "- Effective SITE_URL source: ${effective_site_url_source}"
            echo "- Base path: ${base_path}"
            echo "- Decision: ${deploy_reason}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0

      - run: npm ci

      - name: Run H6 admin tests and secondary editor browser round-trip
        run: npm run qa:h6:admin

      - name: Validate H6 browser evidence contracts
        run: npm run test:h6-evidence-contracts

      - name: Restore responsive media build cache
        id: responsive-media-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: public/_media/h5
          key: ${{ runner.os }}-node22-h5-media-v2-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node22-h5-media-v2-

      - run: npm run check
        env:
          DEPLOY_TARGET: ${{ steps.deploy-meta.outputs.deploy_target }}
          PRODUCTION_DEPLOY_ENABLED: ${{ steps.deploy-meta.outputs.production_enabled }}
          SITE_URL: ${{ steps.deploy-meta.outputs.effective_site_url }}
          TEST_SITE_URL: ${{ steps.deploy-meta.outputs.test_site_url }}
          BASE_PATH: ${{ steps.deploy-meta.outputs.base_path }}

      - run: npm run build
        env:
          DEPLOY_TARGET: ${{ steps.deploy-meta.outputs.deploy_target }}
          PRODUCTION_DEPLOY_ENABLED: ${{ steps.deploy-meta.outputs.production_enabled }}
          SITE_URL: ${{ steps.deploy-meta.outputs.effective_site_url }}
          TEST_SITE_URL: ${{ steps.deploy-meta.outputs.test_site_url }}
          BASE_PATH: ${{ steps.deploy-meta.outputs.base_path }}

      - name: Prove targeted exact SSG against the full production build
        run: npm run qa:h6:exact-targeted
        env:
          TEST_SITE_URL: ${{ steps.deploy-meta.outputs.test_site_url }}
          BASE_PATH: ${{ steps.deploy-meta.outputs.base_path }}

      - name: Validate deterministic performance budgets
        run: npm run qa:performance
        env:
          BASE_PATH: ${{ steps.deploy-meta.outputs.base_path }}

      - name: Save validated responsive media build cache
        if: success() && steps.responsive-media-cache.outputs.cache-hit != 'true' && hashFiles('public/_media/h5/manifest.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: public/_media/h5
          key: ${{ steps.responsive-media-cache.outputs.cache-primary-key }}

      - name: Validate final source and rendered contracts
        run: npm run qa:final:static
        env:
          DEPLOY_TARGET: ${{ steps.deploy-meta.outputs.deploy_target }}
          BASE_PATH: ${{ steps.deploy-meta.outputs.base_path }}

      - name: Validate public search matching and generated coverage
        run: npm run test:public-search && npm run qa:public-search

      - name: Prepare proven reachable Pages artifact
        run: npm run deploy:prepare
        env:
          BASE_PATH: ${{ steps.deploy-meta.outputs.base_path }}

      - name: Revalidate published Pages artifact
        run: npm run qa:performance
        env:
          BASE_PATH: ${{ steps.deploy-meta.outputs.base_path }}

      - name: Verify public search survives deploy pruning
        run: npm run qa:public-search

      - name: Run browser and motion gates
        run: npm run qa:final:browser
        env:
          BASE_PATH: ${{ steps.deploy-meta.outputs.base_path }}

      - name: Prove public artifact isolation
        run: npm run qa:deploy-isolation
        env:
          BASE_PATH: ${{ steps.deploy-meta.outputs.base_path }}

      - name: Open and reconcile every production route in public and editor modes
        run: npm run qa:h6:route-passport
        env:
          DEPLOY_TARGET: ${{ steps.deploy-meta.outputs.deploy_target }}
          BASE_PATH: ${{ steps.deploy-meta.outputs.base_path }}
          SITE_URL: ${{ steps.deploy-meta.outputs.effective_site_url }}
          TEST_SITE_URL: ${{ steps.deploy-meta.outputs.test_site_url }}

      - name: Prove GPS metadata removal through canonical, H5 and deploy artifact
        run: npm run qa:h6:media-privacy
        env:
          BASE_PATH: ${{ steps.deploy-meta.outputs.base_path }}

      - name: Prove checksummed backup and atomic restore in fresh exact-HEAD checkouts
        run: npm run qa:h6:backup-restore

      - name: Preserve the validated build and its evidence
        run: |
          mkdir -p .admin-runtime/ci
          tar -cf .admin-runtime/ci/validated-build.tar dist .admin-runtime/h6-qa

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-build-${{ github.sha }}
          path: .admin-runtime/ci/validated-build.tar
          compression-level: 0
          overwrite: true
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: build-diagnostics-${{ github.sha }}
          path: .admin-runtime/h6-qa
          include-hidden-files: true
          overwrite: true
          retention-days: 14

  admin-actions:
    if: inputs.resume_evidence_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Check all isolated editor actions
        run: node tools/qa/isolated-admin-action-qa.mjs --stage=actions
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: admin-actions-${{ github.sha }}
          path: .admin-runtime/h6-qa/admin-action-crawl.json
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  admin-acceptance:
    if: inputs.resume_evidence_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Check isolated media promotion, roles, Undo and recovery
        run: node tools/qa/isolated-admin-action-qa.mjs --stage=acceptance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: admin-acceptance-${{ github.sha }}
          path: .admin-runtime/h6-qa/visual-editor-acceptance.json
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  public-inputs:
    # The expensive crawl starts only after the shorter independent gates pass.
    needs: [build, admin-actions, admin-acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      cache_hit: ${{ steps.reuse.outputs.cache_hit }}
      cache_key: ${{ steps.inputs.outputs.cache_key }}
      input_key: ${{ steps.inputs.outputs.input_key }}
    env:
      BASE_PATH: ${{ needs.build.outputs.base_path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-build-${{ github.sha }}
          path: .admin-runtime/ci
      - run: node tools/qa/restore-ci-artifact.mjs
      - id: inputs
        run: node tools/qa/public-action-cache.mjs prepare
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .admin-runtime/h6-qa/public-action-cache/stored
          key: ${{ steps.inputs.outputs.cache_key }}
      - id: reuse
        name: Validate cached artifact, harness, runtime and complete coverage
        run: node tools/qa/public-action-cache.mjs restore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.reuse.outputs.cache_hit == 'true'
        with:
          name: reused-public-evidence-${{ github.sha }}
          path: |
            .admin-runtime/h6-qa/public-action-crawl.json
            .admin-runtime/h6-qa/public-action-reuse.json
          include-hidden-files: true
          overwrite: true
          retention-days: 14

  public-actions:
    needs: [build, public-inputs]
    if: needs.public-inputs.outputs.cache_hit != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      BASE_PATH: ${{ needs.build.outputs.base_path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-build-${{ github.sha }}
          path: .admin-runtime/ci
      - run: node tools/qa/restore-ci-artifact.mjs
      - name: Crawl concrete public routes on this dedicated runner
        run: node tools/qa/public-action-crawl.mjs --shard=${{ matrix.shard }}/8 --expected-input-key=${{ needs.public-inputs.outputs.input_key }} --output=.admin-runtime/h6-qa/shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-shard-${{ matrix.shard }}-${{ github.sha }}
          path: .admin-runtime/h6-qa/shard-${{ matrix.shard }}.json*
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  public-evidence:
    needs: [build, public-inputs, public-actions]
    if: always() && !cancelled() && needs.public-inputs.result == 'success' && (needs.public-inputs.outputs.cache_hit == 'true' || needs.public-actions.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BASE_PATH: ${{ needs.build.outputs.base_path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-build-${{ github.sha }}
          path: .admin-runtime/ci
      - run: node tools/qa/restore-ci-artifact.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.public-inputs.outputs.cache_hit == 'true'
        with:
          name: reused-public-evidence-${{ github.sha }}
          path: .admin-runtime/h6-qa
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.public-inputs.outputs.cache_hit != 'true'
        with:
          pattern: public-shard-*-${{ github.sha }}
          path: .admin-runtime/h6-qa/public-action-shards
          merge-multiple: true
      - name: Reconcile every shard and validate full public evidence
        if: needs.public-inputs.outputs.cache_hit != 'true'
        run: |
          inputs=()
          for shard in {1..8}; do inputs+=("--input=.admin-runtime/h6-qa/public-action-shards/shard-${shard}.json"); done
          node tools/qa/public-action-shards.mjs "${inputs[@]}"
          node tools/qa/public-action-cache.mjs seal
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: needs.public-inputs.outputs.cache_hit != 'true'
        with:
          path: .admin-runtime/h6-qa/public-action-cache/stored
          key: ${{ needs.public-inputs.outputs.cache_key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-evidence-${{ github.sha }}
          path: |
            .admin-runtime/h6-qa/public-action-crawl.json
            .admin-runtime/h6-qa/public-action-reuse.json
          include-hidden-files: true
          overwrite: true
          retention-days: 14

  release:
    needs: [build, admin-actions, admin-acceptance, public-evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-build-${{ github.sha }}
          path: .admin-runtime/ci
      - run: node tools/qa/restore-ci-artifact.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: admin-*-${{ github.sha }}
          path: .admin-runtime/h6-qa
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-evidence-${{ github.sha }}
          path: .admin-runtime/h6-qa
      - name: Reconcile exact source, unchanged public inputs and all evidence
        run: npm run qa:h6:verify-evidence

      - name: Write deterministic release artifact identity
        run: node tools/release/artifact-identity.mjs --dist dist --tested-sha "${GITHUB_SHA}"

      - name: Verify exact candidate and preview ref pair
        if: needs.build.outputs.deploy_kind == 'test'
        shell: bash
        run: |
          candidate_sha="$(git ls-remote --refs origin refs/heads/v4-product-final-candidate | awk '{print $1}')"
          preview_sha="$(git ls-remote --refs origin refs/heads/preview | awk '{print $1}')"
          if [ -z "$candidate_sha" ] || [ -z "$preview_sha" ]; then
            echo "::error::Candidate or preview ref is missing; refusing Pages artifact upload."
            exit 1
          fi
          if [ "$candidate_sha" != "$preview_sha" ] || [ "$preview_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Pages deploy requires candidate == preview == tested GITHUB_SHA."
            echo "candidate=$candidate_sha preview=$preview_sha tested=$GITHUB_SHA"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: needs.build.outputs.deploy_kind == 'test'
        with:
          path: dist

  deploy-test:
    if: needs.build.outputs.deploy_kind == 'test'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: [build, release]
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Reconcile exact refs immediately before Pages deployment
        shell: bash
        run: |
          candidate_sha="$(git ls-remote --refs origin refs/heads/v4-product-final-candidate | awk '{print $1}')"
          preview_sha="$(git ls-remote --refs origin refs/heads/preview | awk '{print $1}')"
          if [ -z "$candidate_sha" ] || [ -z "$preview_sha" ]; then
            echo "::error::Candidate or preview ref is missing; refusing Pages deployment."
            exit 1
          fi
          if [ "$candidate_sha" != "$preview_sha" ] || [ "$preview_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Candidate/preview refs changed after validation; refusing Pages deployment."
            echo "candidate=$candidate_sha preview=$preview_sha tested=$GITHUB_SHA"
            exit 1
          fi

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  resume-evidence:
    if: inputs.resume_evidence_run != '' && inputs.deploy_target == 'test' && github.ref_name != 'main' && github.ref_name != 'master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.original.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: qa-tools
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: qa-tools/package-lock.json
      - run: npm ci
        working-directory: qa-tools
      - name: Check reconciliation and exact-run contracts
        run: node --test tools/qa/public-action-shards.test.mjs tools/qa/resume-preview-evidence.test.mjs tools/qa/evidence-contract.test.mjs tools/qa/restore-ci-artifact.test.mjs tools/qa/ci-gates.test.mjs
        working-directory: qa-tools
      - id: original
        name: Require the unchanged candidate, preview and every successful original browser job
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ inputs.resume_evidence_run }}
        run: node qa-tools/tools/qa/resume-preview-evidence.mjs resolve --run-id="$ORIGINAL_RUN"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: site
          ref: ${{ steps.original.outputs.source_sha }}
      - name: Preserve the original source identity and share unchanged dependencies
        run: |
          git -C site switch -c preview
          ln -s ../qa-tools/node_modules site/node_modules
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-build-${{ steps.original.outputs.source_sha }}
          path: site/.admin-runtime/ci
          run-id: ${{ inputs.resume_evidence_run }}
          github-token: ${{ github.token }}
      - run: tar -xmf .admin-runtime/ci/validated-build.tar
        working-directory: site
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: admin-*-${{ steps.original.outputs.source_sha }}
          path: site/.admin-runtime/h6-qa
          merge-multiple: true
          run-id: ${{ inputs.resume_evidence_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: public-shard-*-${{ steps.original.outputs.source_sha }}
          path: site/.admin-runtime/h6-qa/public-action-shards
          merge-multiple: true
          run-id: ${{ inputs.resume_evidence_run }}
          github-token: ${{ github.token }}
      - id: reconcile
        name: Reconcile all immutable original shards, preserving their SHA and individual clocks
        env:
          ORIGINAL_RUN: ${{ inputs.resume_evidence_run }}
          TESTED_SHA: ${{ steps.original.outputs.source_sha }}
        run: node qa-tools/tools/qa/resume-preview-evidence.mjs reconcile --site=site --tooling=qa-tools --run-id="$ORIGINAL_RUN"
      - id: seal
        name: Recompute original artifact, harness and actual runtime identity
        env:
          BASE_PATH: ${{ steps.reconcile.outputs.base_path }}
        run: node tools/qa/public-action-cache.mjs seal
        working-directory: site
      - name: Refresh only reports whose artifact identity preceded tracked SVG overlays
        if: steps.reconcile.outputs.artifact_recheck == 'true'
        env:
          BASE_PATH: ${{ steps.reconcile.outputs.base_path }}
          DEPLOY_TARGET: test
          SITE_URL: https://koleaw.github.io
          TEST_SITE_URL: https://koleaw.github.io
        run: |
          node tools/performance/prepare-media.mjs
          tar -xmf .admin-runtime/ci/validated-build.tar dist
          cp .admin-runtime/h6-qa/route-passport.json .admin-runtime/h6-qa/original-route-passport.json
          cp .admin-runtime/h6-qa/media-privacy-chain.json .admin-runtime/h6-qa/original-media-privacy-chain.json
          npm run qa:performance
          npm run qa:h6:route-passport
          npm run qa:h6:media-privacy
        working-directory: site
      - name: Validate every report against the exact original checkout with the reviewed reconciliation contract
        run: node ../qa-tools/tools/qa/verify-h6-evidence.mjs
        working-directory: site
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: site/.admin-runtime/h6-qa/public-action-cache/stored
          key: ${{ steps.seal.outputs.cache_key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reconciled-evidence-${{ steps.original.outputs.source_sha }}
          path: site/.admin-runtime/h6-qa
          include-hidden-files: true
          overwrite: true
          retention-days: 14
      - name: Write identity for the actual tested source
        env:
          TESTED_SHA: ${{ steps.original.outputs.source_sha }}
        run: node tools/release/artifact-identity.mjs --dist dist --tested-sha "$TESTED_SHA"
        working-directory: site
      - name: Require exact candidate and preview before Pages upload
        env:
          TESTED_SHA: ${{ steps.original.outputs.source_sha }}
        run: |
          candidate_sha="$(git ls-remote --refs origin refs/heads/v4-product-final-candidate | awk '{print $1}')"
          preview_sha="$(git ls-remote --refs origin refs/heads/preview | awk '{print $1}')"
          test "$candidate_sha" = "$TESTED_SHA" && test "$preview_sha" = "$TESTED_SHA"
        working-directory: site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/dist

  deploy-resumed-preview:
    needs: resume-evidence
    if: needs.resume-evidence.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resume-evidence.outputs.source_sha }}
      - name: Reconcile exact refs immediately before Pages deployment
        env:
          TESTED_SHA: ${{ needs.resume-evidence.outputs.source_sha }}
        run: |
          candidate_sha="$(git ls-remote --refs origin refs/heads/v4-product-final-candidate | awk '{print $1}')"
          preview_sha="$(git ls-remote --refs origin refs/heads/preview | awk '{print $1}')"
          test "$candidate_sha" = "$TESTED_SHA" && test "$preview_sha" = "$TESTED_SHA"
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
